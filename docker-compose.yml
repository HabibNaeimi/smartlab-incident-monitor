services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:18883:1883"
    volumes:
      - type: bind
        source: ./infra/mosquitto/config/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "healthcheck/mosquitto", "-n", "-q", "1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - smartlab
    stop_grace_period: 30s
    restart: unless-stopped

  influxdb:
    image: influxdb:2
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME:?Set DOCKER_INFLUXDB_INIT_USERNAME in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD:?Set DOCKER_INFLUXDB_INIT_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG:?Set DOCKER_INFLUXDB_INIT_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET:?Set DOCKER_INFLUXDB_INIT_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:?Set DOCKER_INFLUXDB_INIT_ADMIN_TOKEN in .env}
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - smartlab
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config:

networks:
  smartlab:
    driver: bridge
